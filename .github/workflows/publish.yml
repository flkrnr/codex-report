name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.5.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Check npm publishing policy
        id: policy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == "release" ]] && \
             git tag -l "$RELEASE_TAG" --format='%(contents)' | grep -Fxq 'publish-to-npm=false'; then
            publish=false
            echo "Automatic npm publishing is disabled for $RELEASE_TAG"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.policy.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release version
        if: steps.policy.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version=$(node --print "require('./package.json').version")
          tag_version=${RELEASE_TAG#v}
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "package.json version $package_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Test
        if: steps.policy.outputs.publish == 'true'
        run: npm test

      - name: Validate package
        if: steps.policy.outputs.publish == 'true'
        run: npm pack --dry-run

      - name: Publish
        if: steps.policy.outputs.publish == 'true'
        run: npm publish
